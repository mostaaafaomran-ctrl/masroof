<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مصروف | Student budget tracker in EGP</title>
<meta name="description" content="Masroof: a student allowance tracker in EGP. Monthly budget, category limits, a safe-to-spend-per-day number and a runs-out warning. Arabic and English, saved in your browser.">
<meta property="og:title" content="مصروف | Masroof">
<meta property="og:description" content="Student allowance tracker: how much can I spend per day? Arabic + English, EGP, saved locally.">
<meta property="og:type" content="website">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23181a17'/%3E%3Ctext x='50' y='70' font-size='56' font-weight='900' text-anchor='middle' fill='%23c6f432'%3Eج%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#141612;--p:#1d201b;--p2:#262a23;--ln:#363b31;--tx:#efeee6;--dim:#9a9d8e;--lime:#c6f432;--red:#ff6b5b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:36px 36px;background-position:-1px -1px}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 0,transparent 0,var(--bg) 85%);pointer-events:none}
.wrap{position:relative;max-width:960px;margin:0 auto;padding:22px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font:900 28px system-ui;color:var(--lime)}.logo small{font:500 13px system-ui;color:var(--dim);margin-inline-start:8px;letter-spacing:2px}
.ctl{display:flex;gap:8px;align-items:center}
.ctl button,.ctl input{background:var(--p);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.hero{margin:20px 0;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px}
.box{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:16px}
.box .k{font-size:12px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
.box .v{font:800 34px/1.2 system-ui;margin-top:2px}
.box.main{background:var(--lime);color:#141612;border-color:var(--lime)}.box.main .k{color:#3a4a10}
.box .s{font-size:13px;opacity:.8}
.neg{color:var(--red)}
.warn{margin:0 0 14px;padding:12px 16px;border-radius:12px;border:1px solid var(--red);background:#2a1512;color:#ffc9c2}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
h2{font-size:15px;margin:0 0 12px;color:var(--lime);letter-spacing:1px;text-transform:uppercase}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f .w{grid-column:1/-1}
label{font-size:12px;color:var(--dim);display:block;margin-bottom:3px}
.in{width:100%;background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;font:inherit}
.go{grid-column:1/-1;background:var(--lime);color:#141612;border:0;border-radius:8px;padding:11px;font-weight:800;cursor:pointer;font-size:15px}
.cat{margin-bottom:11px}.cat .h{display:flex;justify-content:space-between;font-size:14px}.cat .h span:last-child{font-family:system-ui;color:var(--dim)}
.bar{height:10px;background:var(--p2);border-radius:99px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--lime);border-radius:99px}.bar.o i{background:var(--red)}
.lim{width:80px;background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:2px 6px;font:12px system-ui;margin-inline-start:6px}
.list{margin-top:14px}.row{display:grid;grid-template-columns:86px 80px 1fr auto 26px;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--ln);font-size:14px}
.row .d{font:12px system-ui;color:var(--dim)}.row .c{font-size:12px;background:var(--p2);border-radius:99px;padding:1px 9px;text-align:center}.row .a{font:700 15px system-ui}
.row button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px}
.empty{color:var(--dim);padding:14px 4px}
.exp{margin-top:12px;background:none;border:1px dashed var(--ln);color:var(--dim);border-radius:8px;padding:6px 12px;cursor:pointer}
footer{margin-top:24px;color:var(--dim);font-size:13px}footer a{color:var(--lime)}
@media(max-width:760px){.hero,.cols{grid-template-columns:1fr}.row{grid-template-columns:70px 70px 1fr auto 24px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="logo">مصروف<small>MASROOF</small></div>
<div class="ctl"><input type="month" id="mo" aria-label="month"><button id="lg">English</button></div></div>

<section class="hero">
<div class="box main"><div class="k" id="k1"></div><div class="v" id="v1"></div><div class="s" id="s1"></div></div>
<div class="box"><div class="k" id="k2"></div><div class="v" id="v2"></div><div class="s" id="s2"></div></div>
<div class="box"><div class="k" id="k3"></div><div class="v" id="v3"></div><div class="s" id="s3"></div></div>
</section>
<div id="wr"></div>

<div class="cols">
<section class="box"><h2 id="h1"></h2>
<div class="f"><div class="w"><label id="la"></label><input class="in" type="number" id="al" min="0" step="50"></div>
<div><label id="l2"></label><input class="in" type="number" id="am" min="0" step="0.5" placeholder="0"></div>
<div><label id="l3"></label><select class="in" id="ct"></select></div>
<div><label id="l4"></label><input class="in" type="date" id="dt"></div>
<div><label id="l5"></label><input class="in" id="nt" maxlength="40"></div>
<button class="go" id="add"></button></div></section>
<section class="box"><h2 id="h2"></h2><div id="cats"></div></section>
</div>
<section class="box list"><h2 id="h3"></h2><div id="rows"></div><button class="exp" id="csv"></button></section>
<footer id="ft"></footer>
</div>
<script src="core.js"></script>
<script>
(function(){
var M=Masroof,$=function(i){return document.getElementById(i)},KEY='masroof.v1';
var I={ar:{k1:'تقدر تصرف في اليوم',k2:'المتبقي',k3:'المصروف',h1:'سجّل مصروف',h2:'حسب الفئة (اضغط الحد لتعديله)',h3:'العمليات',la:'مصروف الشهر (جنيه)',l2:'المبلغ',l3:'الفئة',l4:'التاريخ',l5:'ملاحظة',add:'+ إضافة',csv:'تصدير CSV',lg:'English',
 cats:{food:'أكل وشرب',transport:'مواصلات',study:'دراسة',fun:'خروج وترفيه',other:'أخرى'},per:'في اليوم لمدة',days:'يوم متبقي',sp:'من',ofl:'حد',over:'تعدّيت الميزانية بـ',run:'بمعدل صرفك الحالي هتخلص فلوسك قبل آخر الشهر. المتوقع:',empty:'لسه مفيش مصاريف الشهر ده.',cur:'ج',ft:'بياناتك بتتحفظ في متصفحك بس. لا حساب ولا سيرفر.'},
 en:{k1:'Safe to spend per day',k2:'Left this month',k3:'Spent',h1:'Add expense',h2:'By category (click a limit to edit)',h3:'Transactions',la:'Monthly allowance (EGP)',l2:'Amount',l3:'Category',l4:'Date',l5:'Note',add:'+ Add',csv:'Export CSV',lg:'العربية',
 cats:{food:'Food',transport:'Transport',study:'Study',fun:'Fun',other:'Other'},per:'per day for',days:'days left',sp:'of',ofl:'limit',over:'Over budget by',run:'At your current pace you run out before month end. Projected:',empty:'No expenses this month yet.',cur:'EGP',ft:'Saved in your browser only. No account, no server.'}};
var st;try{st=JSON.parse(localStorage.getItem(KEY))}catch(e){}
st=st||{lang:'ar',allowance:4000,limits:{food:1500,transport:600,fun:500},expenses:[]};
var today=new Date(),ts=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
var key=ts.slice(0,7);
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function n(x){return Math.round(x).toLocaleString('en-US')}
function render(){
  var t=I[st.lang];document.documentElement.lang=st.lang;document.documentElement.dir=st.lang==='ar'?'rtl':'ltr';
  ['k1','k2','k3','h1','h2','h3'].forEach(function(i){$(i).textContent=t[i]});
  $('la').textContent=t.la;$('l2').textContent=t.l2;$('l3').textContent=t.l3;$('l4').textContent=t.l4;$('l5').textContent=t.l5;$('add').textContent=t.add;$('csv').textContent=t.csv;$('lg').textContent=t.lg;$('ft').textContent=t.ft;
  var cv=$('ct').value||'food';$('ct').innerHTML=M.CATS.map(function(c){return '<option value="'+c+'">'+t.cats[c]+'</option>'}).join('');$('ct').value=cv;
  $('mo').value=key;if(document.activeElement!==$('al'))$('al').value=st.allowance;if(!$('dt').value)$('dt').value=ts;
  var s=M.summarize(st,key,ts);
  $('v1').textContent=n(s.safe)+' '+t.cur;$('s1').textContent=s.daysLeft>0?t.per+' '+s.daysLeft+' '+t.days:'';
  $('v2').textContent=n(s.left)+' '+t.cur;$('v2').className='v'+(s.left<0?' neg':'');$('s2').textContent=t.sp+' '+n(st.allowance);
  $('v3').textContent=n(s.spent)+' '+t.cur;$('s3').textContent=s.count+' ×';
  $('wr').innerHTML=s.over?'<div class="warn">'+t.over+' '+n(-s.left)+' '+t.cur+'</div>':(s.willRunOut?'<div class="warn">'+t.run+' '+n(s.projected)+' '+t.cur+'</div>':'');
  $('cats').innerHTML=s.cats.map(function(c){return '<div class="cat"><div class="h"><span>'+t.cats[c.cat]+'</span><span>'+n(c.spent)+' '+t.sp+' <input class="lim" type="number" min="0" data-c="'+c.cat+'" value="'+(c.limit||'')+'" placeholder="'+t.ofl+'"></span></div><div class="bar'+(c.over?' o':'')+'"><i style="width:'+c.pct+'%"></i></div></div>'}).join('');
  var ex=st.expenses.filter(function(e){return M.monthKey(e.date)===key}).sort(function(a,b){return a.date<b.date?1:-1});
  $('rows').innerHTML=ex.length?ex.map(function(e){return '<div class="row"><span class="d">'+e.date+'</span><span class="c">'+t.cats[e.cat]+'</span><span>'+esc(e.note)+'</span><span class="a">'+n(e.amount)+'</span><button data-x="'+e.id+'" aria-label="delete">×</button></div>'}).join(''):'<div class="empty">'+t.empty+'</div>';
}
function esc(s){return String(s||'').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
$('add').onclick=function(){var a=parseFloat($('am').value);if(!(a>0))return $('am').focus();st.expenses.push({id:Date.now()+Math.random(),date:$('dt').value||ts,cat:$('ct').value,amount:a,note:$('nt').value});$('am').value='';$('nt').value='';save();var m=M.monthKey(st.expenses[st.expenses.length-1].date);key=m;render()};
$('al').oninput=function(){st.allowance=Math.max(0,parseFloat(this.value)||0);save();render()};
$('mo').onchange=function(){if(this.value){key=this.value;render()}};
$('lg').onclick=function(){st.lang=st.lang==='ar'?'en':'ar';save();render()};
$('cats').onchange=function(e){var c=e.target.dataset.c;if(c){st.limits[c]=Math.max(0,parseFloat(e.target.value)||0);save();render()}};
$('rows').onclick=function(e){var x=e.target.closest('[data-x]');if(x){st.expenses=st.expenses.filter(function(y){return String(y.id)!==x.dataset.x});save();render()}};
$('csv').onclick=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+M.toCSV(st.expenses)],{type:'text/csv'}));a.download='masroof.csv';a.click()};
if(new URLSearchParams(location.search).get('demo')==='1'&&!st.expenses.length){var D=function(d,c,a,nn){st.expenses.push({id:Math.random(),date:key+'-'+d,cat:c,amount:a,note:nn})};D('02','food',420,'سوبر ماركت');D('04','transport',150,'مترو واتوبيس');D('07','study',380,'ملازم وطباعة');D('09','food',260,'غدا الكلية');D('12','fun',340,'قهوة مع الشلة');D('15','food',510,'أكل');D('18','transport',200,'أوبر');D('21','study',240,'كتاب');D('23','fun',300,'سينما')}
render();
})();
</script>
</body></html>
